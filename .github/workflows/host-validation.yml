name: Host validation
on:
  pull_request:
  push:
    branches: [main, workbench-release-qualification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bridge/requirements-lock.txt
      - name: Install pinned host dependencies
        run: python -m pip install -r bridge/requirements-lock.txt
      - name: Check C and MCP host contracts
        run: python scripts/ci_host.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-validation-logs
          path: evidence/ci/
          retention-days: 14
